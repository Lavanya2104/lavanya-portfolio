<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lavanya Mittal | Work</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Script&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0c0f;
      --shell:#1b1e22;
      --shell2:#20242a;

      --panel:rgba(255,255,255,0.05);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.6);
      --accent:#5f8cff;

      --neonB: rgba(90,150,255,0.55);
      --neonBStrong: rgba(90,150,255,0.9);

      --radius:18px;
      --shadow:0 20px 50px rgba(0,0,0,0.55);
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:#0b0c0f;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.55);
      z-index:-1;
    }

    /* ===== NEON BACKGROUND LAYER (BLUE ONLY) ===== */
    .neon-bg{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:0.9;
      background:
        radial-gradient(900px 520px at 18% 12%, rgba(90,150,255,0.12), transparent 60%),
        radial-gradient(900px 520px at 82% 18%, rgba(90,150,255,0.09), transparent 60%),

        /* vertical neon lines */
        linear-gradient(to bottom, transparent 0 88px, var(--neonB) 88px 92px, transparent 92px) 18% 0 / 2px 160px repeat-y,
        linear-gradient(to bottom, transparent 0 110px, var(--neonB) 110px 114px, transparent 114px) 42% 0 / 2px 210px repeat-y,
        linear-gradient(to bottom, transparent 0 60px, var(--neonB) 60px 64px, transparent 64px) 68% 0 / 2px 180px repeat-y,
        linear-gradient(to bottom, transparent 0 140px, var(--neonB) 140px 144px, transparent 144px) 84% 0 / 2px 240px repeat-y,

        /* horizontal neon lines */
        linear-gradient(to right, transparent 0 120px, var(--neonB) 120px 124px, transparent 124px) 0 30% / 260px 2px repeat-x,
        linear-gradient(to right, transparent 0 160px, var(--neonB) 160px 164px, transparent 164px) 0 52% / 320px 2px repeat-x,
        linear-gradient(to right, transparent 0 90px,  var(--neonB) 90px  94px,  transparent 94px) 0 74% / 220px 2px repeat-x,

        /* faint grid */
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);

      background-size:
        auto, auto,
        2px 160px, 2px 210px, 2px 180px, 2px 240px,
        260px 2px, 320px 2px, 220px 2px,
        140px 140px, 140px 140px;

      filter: blur(0.25px);
    }

    .neon-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 18% 30%, var(--neonBStrong) 0 4px, transparent 6px),
        radial-gradient(circle at 42% 52%, var(--neonBStrong) 0 4px, transparent 6px),
        radial-gradient(circle at 68% 74%, var(--neonBStrong) 0 4px, transparent 6px),
        radial-gradient(circle at 84% 30%, var(--neonBStrong) 0 4px, transparent 6px),
        radial-gradient(circle at 55% 18%, rgba(90,150,255,0.65) 0 3px, transparent 5px),
        radial-gradient(circle at 30% 80%, rgba(90,150,255,0.55) 0 3px, transparent 5px);
      opacity:0.9;
    }

    /* ====== shell ====== */
    .shell{
      width: min(1200px, 94vw);
      margin: 26px auto 34px;
      background: linear-gradient(180deg, rgba(32,36,42,0.92), rgba(27,30,34,0.92));
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 26px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.65);
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    header, main{ position:relative; z-index:3; }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      background: rgba(18,19,22,0.35);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav-wrap{
      width:min(1150px,92vw);
      margin:auto;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:16px 0;
    }

    .brand{
      font-family: 'Playfair Script', cursive;
      font-size: 34px !important;
      font-weight: 400;
      letter-spacing:0.04em;
      text-transform:none;
      justify-self:start;
      color: rgba(255,255,255,0.95);
      line-height: 1;
    }

    .nav-center{
      display:flex;
      gap:18px;
      justify-self:center;
      align-items:center;
    }

    .nav-spacer{ justify-self:end; }

    nav a{
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      font-size:17px;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: 0.2s ease;
      position: relative; /* underline */
    }

    nav a.active{
      color: var(--text);
      border-color: rgba(90,150,255,0.36);
      box-shadow:
        0 0 0 3px rgba(90,150,255,0.12),
        0 0 18px rgba(90,150,255,0.18);
      background: rgba(255,255,255,0.03);
    }

    /* ACTIVE underline base + animation */
    nav a.active::after{
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: -8px;
      height: 3px;
      border-radius: 999px;
      animation: tabGlow 0.6s ease-out;
    }

    /* HOME — green underline */
    .nav-center a:nth-child(1).active::after{
      background: linear-gradient(to right, rgba(0,255,170,0), rgba(0,255,170,0.95), rgba(0,255,170,0));
      box-shadow: 0 0 12px rgba(0,255,170,0.6), 0 0 26px rgba(0,255,170,0.35);
    }

    /* WORK — pink underline */
    .nav-center a:nth-child(2).active::after{
      background: linear-gradient(to right, rgba(255,90,200,0), rgba(255,90,200,0.95), rgba(255,90,200,0));
      box-shadow: 0 0 12px rgba(255,90,200,0.6), 0 0 26px rgba(255,90,200,0.35);
    }

    /* ABOUT — purple underline */
    .nav-center a:nth-child(3).active::after{
      background: linear-gradient(to right, rgba(160,90,255,0), rgba(160,90,255,0.95), rgba(160,90,255,0));
      box-shadow: 0 0 12px rgba(160,90,255,0.6), 0 0 26px rgba(160,90,255,0.35);
    }

    @keyframes tabGlow{
      from{ transform: scaleX(0.4); opacity: 0; }
      to{ transform: scaleX(1); opacity: 1; }
    }

    /* NAV TABS – NEON COLORS */
    .nav-center a:nth-child(1){
      border: 1px solid rgba(0,255,170,0.55);
      box-shadow: inset 0 0 0 1px rgba(0,255,170,0.55), 0 0 10px rgba(0,255,170,0.12);
    }
    .nav-center a:nth-child(2){
      border: 1px solid rgba(255,90,200,0.55);
      box-shadow: inset 0 0 0 1px rgba(255,90,200,0.55), 0 0 10px rgba(255,90,200,0.12);
    }
    .nav-center a:nth-child(3){
      border: 1px solid rgba(160,90,255,0.55);
      box-shadow: inset 0 0 0 1px rgba(160,90,255,0.55), 0 0 10px rgba(160,90,255,0.12);
    }

    /* hover blue glow */
    .nav-center a:hover{
      border-color: rgba(90,150,255,0.55) !important;
      box-shadow: inset 0 0 0 1px rgba(90,150,255,0.55), 0 0 14px rgba(90,150,255,0.20);
      background: rgba(255,255,255,0.03);
    }

    .wrap{
      width:min(1150px,92vw);
      margin:auto;
      padding:34px 0 90px;
    }

    /* ===== WORK PAGE ONLY (wider) ===== */
    body.work-page .shell{
      width: min(1380px, 96vw);
    }
    body.work-page .nav-wrap,
    body.work-page .wrap{
      width: min(1320px, 94vw);
    }

    /* ===== shared section title ===== */
    .section{ margin-top:36px; }
    .section-title{
      text-align:left;
      font-size:22px;
      letter-spacing:0.22em;
      text-transform:uppercase;
      margin-bottom:22px;
      color:rgba(255,255,255,0.88);
      position: relative;
      display: block;
    }
    .section-title::after{
      content:"";
      position: absolute;
      left:0;
      bottom:-12px;
      width:100%;
      height: 2px;
      background: linear-gradient(
        to left,
        rgba(90,150,255,0),
        rgba(90,150,255,0.55),
        rgba(90,150,255,0)
      );
      box-shadow:
        0 0 18px rgba(90,150,255,0.30),
        0 0 42px rgba(90,150,255,0.18);
      opacity: 0.85;
    }

    /* ===== reuse abox look (your about tab uses similar) ===== */
    .abox{
      background:rgba(255,255,255,0.045);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* ===================== WORK TAB LAYOUT ===================== */
    .work-shell{
      display:grid;
      grid-template-columns: 320px 1fr;
      gap: 22px;
      align-items: stretch;
      margin-top: 18px;
    }
    @media (max-width: 980px){
      .work-shell{ grid-template-columns: 1fr; }
      .shell{ border-radius: 18px; margin: 14px auto 20px; }
    }

    /* left list */
    .work-left-head h3{ margin:0; font-size:18px; letter-spacing:.2px; }
    .work-left-head p{ margin:6px 0 0; font-size:12px; opacity:.75; }
    .left-hint{
        margin: 0 0 14px;
        font-size: 13px;
        opacity:0.65;
    }
    .project-list{
      display:flex;
      flex-direction:column;
      gap: 14px;
      margin-top: 14px;
    }

    .proj-btn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;

      padding: 20px 20px;
      min-height: 86px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.92);
      cursor:pointer;
      text-align:left;

      transition: transform .15s ease, background .2s ease, border-color .2s ease;
    }

    /* Green */
    .proj-btn:nth-child(1){
      border-color: rgba(0,255,170,0.35);
      box-shadow: inset 0 0 0 1px rgba(0,255,170,0.25);
    }

    /* Pink */
    .proj-btn:nth-child(2){
      border-color: rgba(255,90,200,0.35);
      box-shadow: inset 0 0 0 1px rgba(255,90,200,0.25);
    }

    /* Purple */
    .proj-btn:nth-child(3){
      border-color: rgba(160,90,255,0.35);
      box-shadow: inset 0 0 0 1px rgba(160,90,255,0.25);
    }

    /* Repeat pattern */
    .proj-btn:nth-child(4){
      border-color: rgba(0,255,170,0.35);
    }
    .proj-btn:nth-child(5){
      border-color: rgba(255,90,200,0.35);
    }

    .proj-btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.05);
    }
    .proj-btn.active{
      background: rgba(90, 150, 255, 0.12);
      border-color: rgba(90, 150, 255, 0.65) !important;
      box-shadow:
        inset 0 0 0 1px rgba(90, 150, 255, 0.55),
        0 0 18px rgba(90, 150, 255, 0.35);
    }
    .proj-btn .name{ font-weight: 550; font-size: 15px; line-height: 1.45; letter-spacing: 0.01em; }
    .proj-btn .pill{
      font-size: 12px;
      padding: 6px 10px;
      line-height: 1;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.65);
      background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.06),
        rgba(0,0,0,0.35));
      color: rgba(255,255,255,0.85);
      opacity: .85;
      white-space:nowrap;
      align-self: center;
    }

    /* right */
    .proj-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 12px;
    }
    .proj-title{ margin:0; font-size: 34px; font-weight: 650;}
    .proj-meta{ margin:6px 0 0; font-size: 26px; opacity: .78; }

    .badge{
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      opacity: .9;
      white-space: nowrap;
    }
    .badge.ongoing{
      border-color: rgba(255, 180, 90, 0.35);
      background: rgba(255, 180, 90, 0.10);
    }
    .badge.completed{
      border-color: rgba(120, 255, 170, 0.25);
      background: rgba(120, 255, 170, 0.08);
    }

    .hero-media{
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      height: 450px;
    }
    .hero-media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .sec{ margin-top: 16px; }

    .sec-title{
      margin:0 0 26px;
      font-size: 28px;
      letter-spacing: 2px;
      opacity: .92;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 10px;
      display: inline-block;
    }

    /* BLUE LINE UNDER headings */
    .sec-title::after{
      content:"";
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      height:2px;
      background: linear-gradient(
        to left,
        rgba(90,150,255,0),
        rgba(90,150,255,0.55),
        rgba(90,150,255,0)
      );
      box-shadow:
        0 0 12px rgba(90,150,255,0.30),
        0 0 28px rgba(90,150,255,0.18);
      opacity:0.85;
      pointer-events:none;
    }

    .bullets{ margin:0; padding-left: 18px; }
    .bullets{ margin-bottom: 26px; }

    .bullets li{
      margin:0px 10px 2px;
      line-height: 1.45;
      opacity:.92;
      font-size: 24px;
      margin-bottom: 18px;
    }

    .tags{ display:flex; flex-wrap:wrap; gap: 8px; }
    .tag{
      font-size: 18px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      opacity: .9;
    }

    /* system flow box (draw.io export goes here) */
    .sysflow-box{
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      padding: 12px;
      overflow:hidden;
      min-height: 82px;
    }
    .sysflow-box img{
      width:100%;
      height:auto;
      display:block;
    }

    /* demo button */
    .proj-actions{
      margin-top: 18px;
      display:flex;
      align-items:center;
      gap: 12px;
    }
    .btn-demo{
      display:inline-flex;
      align-items:center;
      font-size: 20px;
      gap:10px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.92);
      text-decoration:none;
      transition: transform .15s ease, background .2s ease;
      cursor: pointer;
    }
    .btn-demo:hover{ transform: translateY(-1px); background: rgba(255,255,255,0.06); }
    .btn-demo.disabled{ pointer-events:none; opacity:.45; cursor:not-allowed; }
    .demo-note{ font-size: 16px; opacity:.65; }

    /* Demo AVAILABLE (blue) */
    .btn-demo:not(.disabled){
      border-color: rgba(90,150,255,0.65);
      background: rgba(90,150,255,0.18);
      color: rgba(255,255,255,0.95);
      box-shadow:
        inset 0 0 0 1px rgba(90,150,255,0.45),
        0 0 18px rgba(90,150,255,0.30);
    }
    .btn-demo:not(.disabled):hover{
      transform: translateY(-1px);
      box-shadow:
        inset 0 0 0 1px rgba(90,150,255,0.6),
        0 0 26px rgba(90,150,255,0.45),
        0 0 48px rgba(90,150,255,0.25);
    }

    /* Video modal */
    #videoModal{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
    }

    .video-backdrop{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
    }

    .video-box{
      position:absolute;
      top:50%;
      left:50%;
      transform: translate(-50%,-50%);
      width: min(900px, 90vw);
      background: #0b0c0f;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(90,150,255,0.45);
      box-shadow: 0 0 40px rgba(90,150,255,0.35);
    }

    .video-box video{
      width:100%;
      height:auto;
      border-radius: 12px;
      display:block;
    }

    /* ===================== GLOBAL MOBILE PATCH (ALL TABS) ===================== */
    @media (max-width: 980px){

      /* overall shell spacing */
      .shell{
        width: min(980px, 96vw);
        border-radius: 18px;
        margin: 14px auto 18px;
      }

      /* sticky header padding */
      .nav-wrap{
        width: min(980px, 92vw);
        padding: 12px 0;
        grid-template-columns: 1fr;      /* stack on mobile */
        gap: 10px;
        justify-items: center;
      }

      /* brand centered + smaller */
      .brand{
        font-size: 28px !important;
        justify-self: center;
      }

      /* nav centered + wraps nicely */
      .nav-center{
        justify-self: center;
        gap: 10px;
        flex-wrap: wrap;                 /* ✅ important */
        justify-content: center;
      }

      nav a{
        font-size: 15px;
        padding: 10px 14px;
      }

      /* remove underline going out of box on small screens */
      nav a.active::after{
        bottom: -6px;
        height: 3px;
        left: 20%;
        right: 20%;
      }

      /* content wrap padding */
      .wrap{
        width: min(980px, 92vw);
        padding: 20px 0 60px;
      }

      /* section title */
      .section-title{
        font-size: 16px;
        letter-spacing: 0.18em;
        margin-bottom: 16px;
      }

      .section-title::after{
        bottom: -10px;
      }
    }

    @media (max-width: 420px){
      .brand{ font-size: 26px !important; }
      nav a{ font-size: 14px; padding: 9px 12px; }
      .wrap{ padding: 18px 0 52px; }
    }

    /* ===================== WORK (work.html) MOBILE PATCH ===================== */
    @media (max-width: 980px){
      .work-shell{
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 12px;
      }

      .abox{
        padding: 14px;
        border-radius: 16px;
      }

      .proj-btn{
        padding: 14px;
        min-height: 72px;
      }
      .proj-btn .name{ font-size: 13px; }
      .proj-btn .pill{ font-size: 11px; padding: 5px 8px; }

      .proj-title{ font-size: 22px; line-height: 1.15; }
      .proj-meta{ font-size: 15px; margin-top: 6px; }

      .hero-media{ height: 240px; }

      .sec-title{ font-size: 16px; margin-bottom: 14px; letter-spacing: 1.4px; }
      .bullets li{ font-size: 14px; line-height: 1.5; margin-bottom: 10px; }

      .tag{ font-size: 12px; padding: 6px 9px; }

      .proj-actions{
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .btn-demo{ font-size: 14px; padding: 10px 12px; }
      .demo-note{ font-size: 12px; }
    }


  </style>
</head>

<body class="work-page">
  <div class="neon-bg"></div>

  <div class="shell">
    <header>
      <div class="nav-wrap">
        <div class="brand">Lavanya Mittal</div>

        <nav class="nav-center" aria-label="Primary">
          <a href="index.html">HOME</a>
          <a class="active" href="work.html">WORK</a>
          <a href="about.html">ABOUT</a>
        </nav>

        <div class="nav-spacer"></div>
      </div>
    </header>

    <main class="wrap">
      <section class="section" aria-label="Work">
        <h2 class="section-title">Projects</h2>

        <div class="work-shell">
          <!-- LEFT -->
          <aside class="abox">
            <p class="left-hint">Select a Project to Explore Details.</p>
            <div id="projectList" class="project-list" role="tablist" aria-label="Project list"></div>
          </aside>

          <!-- RIGHT -->
          <section class="abox" aria-live="polite">
            <div class="proj-head">
              <div>
                <h3 id="projTitle" class="proj-title">Select a project</h3>
                <p id="projMeta" class="proj-meta">—</p>
              </div>
              <span id="projStatus" class="badge">—</span>
            </div>

            <div class="hero-media">
              <img id="projImage" src="" alt="">
            </div>

            <div class="sec">
              <h4 class="sec-title">System Flow</h4>
              <div class="sysflow-box">
                <img id="projFlow" src="" alt="">
              </div>
            </div>

            <div class="sec">
              <h4 class="sec-title">Project Execution</h4>
              <ul id="projExec" class="bullets"></ul>
            </div>

            <div class="sec">
              <h4 class="sec-title">Tech Stack</h4>
              <div id="projTags" class="tags"></div>
            </div>

            <div class="proj-actions">
              <a id="projDemo" class="btn-demo disabled" href="#">▶ View Demo</a>
              <span id="demoNote" class="demo-note">Demo not available</span>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ===================== DATA (EDIT ONLY THIS) =====================
    const PROJECTS = [
      {

    // ===================== RENDER =====================
    const $list = document.getElementById("projectList");
    const $title = document.getElementById("projTitle");
    const $meta = document.getElementById("projMeta");
    const $status = document.getElementById("projStatus");
    const $img = document.getElementById("projImage");
    const $flow = document.getElementById("projFlow");
    const $exec = document.getElementById("projExec");
    const $tags = document.getElementById("projTags");
    const $demo = document.getElementById("projDemo");
    const $demoNote = document.getElementById("demoNote");

    // ✅ Read project id from URL (?project=arm)
    function getProjectFromURL(){
      const params = new URLSearchParams(window.location.search);
      return params.get("project");
    }

    // ✅ Keep URL synced when user clicks on sidebar
    function setProjectInURL(id){
      const url = new URL(window.location);
      url.searchParams.set("project", id);
      history.replaceState({}, "", url);
    }

    function openVideo(url){
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("demoVideo");
      video.src = url;
      video.load();
      modal.style.display = "block";
      video.play().catch(()=>{});
    }

    function closeVideo(){
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("demoVideo");
      video.pause();
      video.removeAttribute("src");
      video.load();
      modal.style.display = "none";
    }

    function loadProject(p){
      $title.textContent = p.title;
      $meta.textContent = p.meta;

      $status.textContent = p.status;
      $status.className = "badge " + (p.statusClass || "");

      // images
      $img.src = p.image || "";
      $img.alt = p.title + " preview";

      $flow.src = p.flow || "";
      $flow.alt = p.title + " system flow diagram";
      $flow.onerror = () => { $flow.removeAttribute("src"); };

      // bullets
      $exec.innerHTML = "";
      (p.execution || []).forEach(line => {
        const li = document.createElement("li");
        li.textContent = line;
        $exec.appendChild(li);
      });

      // tags
      $tags.innerHTML = "";
      (p.tags || []).forEach(t => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        $tags.appendChild(span);
      });

      // demo button
      const hasDemo = p.demoUrl && p.demoUrl.trim().length > 0;

      if (hasDemo){
        $demo.classList.remove("disabled");
        $demoNote.textContent = "Demo available";

        $demo.onclick = (e) => {
          e.preventDefault();
          openVideo(p.demoUrl);
        };
      } else {
        $demo.classList.add("disabled");
        $demoNote.textContent = "Demo not available";
        $demo.onclick = (e) => e.preventDefault();
      }
    }

    function buildList(){
      $list.innerHTML = "";

      const targetId = getProjectFromURL(); // e.g. "arm"
      let targetBtn = null;

      PROJECTS.forEach((p) => {
        const btn = document.createElement("button");
        btn.className = "proj-btn";
        btn.type = "button";
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", "false");

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = p.title;

        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = p.statusClass === "ongoing" ? "Ongoing" : "Completed";

        btn.appendChild(name);
        btn.appendChild(pill);

        btn.addEventListener("click", () => {
          [...$list.querySelectorAll(".proj-btn")].forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-selected", "false");
          });

          btn.classList.add("active");
          btn.setAttribute("aria-selected", "true");

          loadProject(p);

          // ✅ update URL
          setProjectInURL(p.id);
        });

        $list.appendChild(btn);

        // ✅ if URL matches this project id, remember button
        if (targetId && p.id === targetId){
          targetBtn = btn;
        }
      });

      // ✅ auto-open URL project else open first
      setTimeout(() => {
        if (targetBtn) targetBtn.click();
        else {
          const first = $list.querySelector(".proj-btn");
          if (first) first.click();
        }
      }, 0);
    }

    buildList();

    // Close modal on backdrop click
    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("video-backdrop")){
        closeVideo();
      }
    });

    // Close modal on ESC
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape"){
        closeVideo();
      }
    });
  </script>

  <!-- Video Modal (MUST be inside body) -->
  <div id="videoModal">
    <div class="video-backdrop"></div>
    <div class="video-box">
      <video id="demoVideo" controls autoplay></video>
    </div>
  </div>
